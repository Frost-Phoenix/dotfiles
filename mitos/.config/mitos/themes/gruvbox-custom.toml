inherits = "gruvbox"

## Transparent background
"ui.background" = {}
"ui.popup" = {}
"ui.help" = {}
"ui.menu" = {}

## darker less invasive bufferline
"ui.bufferline" = { fg = "fg1" }
"ui.bufferline.active" = { fg = "fg1", bg = "bg2" }
"ui.bufferline.background" = {}

## more visible whitespaces and rulers
"ui.virtual.whitespace" = "gray"
"ui.virtual.indent-guide" = "bg4"
"ui.virtual.ruler" = { fg = "gray", bg = "bg1" }

## Dark hard varriant palette
[palette]
bg0 = "#1d2021"
bg0_s = "#282828"
bg1 = "#32302f"
bg2 = "#3c3836"
bg3 = "#504945"
bg4 = "#665c54"
