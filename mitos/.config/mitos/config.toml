theme = "gruvbox-custom"

[editor]
welcome-screen = false
line-number = "relative"
text-width = 100
icons = true
mouse = false
border-style = "plain"

[editor.rulers]
style = "glyph"
columns = [101]

[editor.picker]
layout = "centered"

[editor.file-picker]
hidden = false
git-ignore = false

[editor.statusline]
mode.color = true
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
left = [
    "mode",
    "spinner",
    "branch",
    "file-name",
    "read-only-indicator",
    "file-modification-indicator",
    "debug-session",
]
right = [
  "search-position",
  "diagnostics",
  "register",
  "file-indent-style",
  "position",
  "position-percentage",
  "total-line-numbers",
  "spacer",
  "file-encoding"
]

[editor.command-line]
show = "auto"

[editor.indent-guides]
render = true
skip-levels = 1

[editor.gutters.line-numbers]
min-width = 4

[editor.soft-wrap]
enable = true

[editor.bufferline]
show = "multiple"

[editor.completion]
trigger-length = 3
word.trigger-length = 3

[editor.cursor]
highlight-line = true
block-rendering = "native"
shape.insert = "bar"
shape.normal = "block"
shape.select = "underline"

[editor.files]
editor-config = false
save.trim-trailing-whitespace = true
reload.poll.interval = 1000

[editor.format]
on-save = false

[keys.normal]
H = "goto_previous_buffer"
L = "goto_next_buffer"

D = ["extend_to_line_bounds", "delete_selection"]
X = ["extend_to_line_bounds", "trim_selections"]

A-p = "paste_after_all"
A-P = "paste_before_all"

A-k = "scroll_up"
A-j = "scroll_down"

C-s = ":write"
C-S = ":write-all"
C-q = ":buffer-close"
C-Q = ":quit"

"`" = "switch_case"

space.i = { label = "Show Changes",     command = ":vcs-show-change" }
space.I = { label = "Restore Changes",  command = ":vcs-restore-change" }
space.W = { label = "Toggle soft wrap", command = ":toggle soft-wrap.enable" }

# Double space for apps binds
[keys.normal.space.space]
l = { label = "Lazygit", command = ":noop %sh_interactive{lazygit}" }
m = { label = "Leaf",    command = ":noop %sh_interactive{leaf %{file_path_absolute} >/dev/tty}" }

[keys.insert]
C-h = "move_char_left"
C-j = "move_visual_line_down"
C-k = "move_visual_line_up"
C-l = "move_char_right"

[commands]
":buffer-name" = ":sh echo %{buffer_name} | xclip -selection clipboard"
":buffer-path" = ":sh echo %{file_path_absolute} | xclip -selection clipboard"
":buffer-position" = ":sh echo %{file_path_absolute}:%{cursor_line}:%{cursor_column} | xclip -selection clipboard"
":size" = ":sh du -h %{file_path_absolute} | cut -f1"
